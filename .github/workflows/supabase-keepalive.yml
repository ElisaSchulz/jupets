# Mantém o projeto do Supabase ativo no plano grátis (que pausa após 1 semana sem uso).
# Roda às segundas e quintas e faz uma consulta simples ao banco.
#
# Precisa de dois "secrets" no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       ex.: https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  a chave anon/publishable do projeto (NUNCA a service_role)
# e da função keepalive() criada por supabase/schema.sql.

name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 * * 1,4"   # segunda e quinta, 9h de Brasília
  workflow_dispatch:          # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY."
            exit 1
          fi
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase respondeu, projeto ativo ✅"
